{% extends 'layout.html' %}

{% block fact %}

<div class="container mt-4">

    <h3>Editar Vendedor</h3>

    <form method="POST">

        <div class="form-group">

            <label for="nombre">Nombre</label>

            <input
                type="text"
                class="form-control"
                id="nombre"
                name="nombre"
                value="{{ vendedor.nombre }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="cedula">Cédula</label>

            <input
                type="text"
                class="form-control"
                id="cedula"
                name="cedula"
                value="{{ vendedor.cedula }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="telefono">Teléfono</label>

            <input
                type="text"
                class="form-control"
                id="telefono"
                name="telefono"
                value="{{ vendedor.telefono }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="direccion">Dirección</label>

            <input
                type="text"
                class="form-control"
                id="direccion"
                name="direccion"
                value="{{ vendedor.direccion }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">Email</label>

            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                value="{{ vendedor.email }}"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary">
            Guardar cambios
        </button>


        <a
            href="{{ url_for('vendedores.index') }}"
            class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock fact %}
