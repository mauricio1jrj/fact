{% extends 'layout.html' %}

{% block fact %}

<div class="container mt-4">
    <h3>Editar Producto</h3>

    <form method="POST">

        <div class="form-group">
            <label>Código</label>
            <input type="text"
                   class="form-control"
                   name="codigo"
                   value="{{ producto.codigo }}"
                   required>
        </div>

        <div class="form-group">
            <label>Nombre</label>
            <input type="text"
                   class="form-control"
                   name="nombre"
                   value="{{ producto.nombre }}"
                   required>
        </div>

        <div class="form-group">
            <label>Descripción</label>
            <input type="text"
                   class="form-control"
                   name="descripcion"
                   value="{{ producto.descripcion }}">
        </div>

        <div class="form-group">
            <label>Unidad de medida</label>
            <input type="text"
                   class="form-control"
                   name="unidad_medida"
                   value="{{ producto.unidad_medida }}"
                   required>
        </div>

        <div class="form-group">
            <label>Precio</label>
            <input type="number"
                   step="0.01"
                   class="form-control"
                   name="precio"
                   value="{{ producto.precio }}"
                   required>
        </div>

        <div class="form-group">
            <label>Stock</label>
            <input type="number"
                   class="form-control"
                   name="stock"
                   value="{{ producto.stock }}"
                   required>
        </div>

        <div class="form-group">
            <label>Categoría</label>

            <select class="form-control"
                    name="categoria_id"
                    required>

                {% for categoria in categorias %}

                <option value="{{ categoria.id }}"
                    {% if categoria.id == producto.categoria_id %}
                    selected
                    {% endif %}>

                    {{ categoria.nombre }}

                </option>

                {% endfor %}

            </select>
        </div>

        <button type="submit"
                class="btn btn-primary">
            Guardar cambios
        </button>

        <a href="{{ url_for('productos.index') }}"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>
</div>

{% endblock fact %}
