{% extends 'layout.html' %}

{% block fact %}

<div class="container mt-4">

    <h3>Editar Cliente</h3>

    <form method="POST">

        <div class="form-group">

            <label>Nombre</label>

            <input
                type="text"
                name="nombre"
                class="form-control"
                value="{{ cliente.nombre }}"
                required
            >

        </div>

        <div class="form-group">

            <label>Cédula</label>

            <input
                type="text"
                name="cedula"
                class="form-control"
                value="{{ cliente.cedula }}"
                required
            >

        </div>

        <div class="form-group">

            <label>Teléfono</label>

            <input
                type="text"
                name="telefono"
                class="form-control"
                value="{{ cliente.telefono }}"
                required
            >

        </div>

        <div class="form-group">

            <label>Dirección</label>

            <input
                type="text"
                name="direccion"
                class="form-control"
                value="{{ cliente.direccion }}"
                required
            >

        </div>

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                class="form-control"
                value="{{ cliente.email }}"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-success">
            Guardar cambios
        </button>

        <a
            href="{{ url_for('clientes.index') }}"
            class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock fact %}
