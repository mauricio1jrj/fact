{% extends 'layout.html' %}

{% block fact %}

<div class="container mt-4">
    <h3>Nuevo Cliente</h3>

    <form method="POST" action="{{ url_for('clientes.crear_cliente') }}">

        <div class="form-group">
            <label>Nombre</label>
            <input
                type="text"
                class="form-control"
                name="nombre"
                required>
        </div>

        <div class="form-group">
            <label>Cédula</label>
            <input
                type="text"
                class="form-control"
                name="cedula"
                required>
        </div>

        <div class="form-group">
            <label>Teléfono</label>
            <input
                type="text"
                class="form-control"
                name="telefono"
                required>
        </div>

        <div class="form-group">
            <label>Dirección</label>
            <input
                type="text"
                class="form-control"
                name="direccion"
                required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                type="email"
                class="form-control"
                name="email"
                required>
        </div>

        <button type="submit" class="btn btn-primary">
            Guardar
        </button>

    </form>
</div>

{% endblock %}
