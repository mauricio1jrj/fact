{% extends 'layout.html' %}

{% block fact %}

<h3>Editar Detalle de Factura</h3>

<form method="POST">


<div class="form-group">
    <label>Factura</label>

    <select name="factura_id"
            class="form-control"
            required>

        {% for factura in facturas %}

        <option value="{{ factura.id }}"
            {% if factura.id == detalle.factura_id %}selected{% endif %}>

            {{ factura.numero_factura }}

        </option>

        {% endfor %}

    </select>
</div>

<div class="form-group">
    <label>Producto</label>

    <select name="producto_id"
            class="form-control"
            required>

        {% for producto in productos %}

        <option value="{{ producto.id }}"
            {% if producto.id == detalle.producto_id %}selected{% endif %}>

            {{ producto.nombre }}

        </option>

        {% endfor %}

    </select>
</div>

<div class="form-group">
    <label>Cantidad</label>

    <input type="number"
           name="cantidad"
           value="{{ detalle.cantidad }}"
           class="form-control"
           required>
</div>

<div class="form-group">
    <label>Precio Unitario</label>

    <input type="number"
           step="0.01"
           name="precio_unitario"
           value="{{ detalle.precio_unitario }}"
           class="form-control"
           required>
</div>

<button type="submit"
        class="btn btn-warning">
    Actualizar
</button>

<a href="{{ url_for('detalles_facturas.index') }}"
   class="btn btn-secondary">
    Cancelar
</a>


</form>

{% endblock fact %}
